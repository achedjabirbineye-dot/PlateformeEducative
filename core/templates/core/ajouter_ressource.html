{% load i18n %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter une ressource</title>
</head>
<body>
    <h2>{% trans "Publier une nouvelle ressource" %}</h2>
    
    <form method="post" enctype="multipart/form-data"> <!-- enctype est OBLIGATOIRE pour les fichiers -->
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{% trans "Publier" %}</button>
    </form>
    
    <p><a href="{% url 'accueil' %}">{% trans "Retour à l'accueil" %}</a></p>
</body>
</html>
